---
# AI-Assisted Code Review Playbook (Task-Based Orchestration)
#
# This playbook performs comprehensive AI-assisted code review using the
# teim-review-agent, which orchestrates all subagents in a single Claude
# invocation. The workflow is:
#
# 1. Inventory copy — copies Zuul executor inventory to the output directory
# 2. ai_review_setup — installs teim-review plugin, configures Claude CLI
# 3. ai_code_review — deterministic prep plus one Claude invocation via
#    teim-review-agent for candidate generation and finding validation
# 4. build_review_report — deterministically assembles review-report.raw.json
# 5. normalize_review_report — repairs/routes structured output deterministically
# 6. ai_html_generation — converts JSON report to HTML (Python, no Claude)
# 7. ai_zuul_integration — posts Gerrit comments, registers artifacts
#
# Required variables (set in job definition):
#   - claude_binary: Path to Claude CLI executable
#   - claude_config_dir: Claude CLI configuration directory
#   - haiku_model, sonnet_model, opus_model: Model name overrides
#   - review_model: Model for the teim-review-agent invocation
#   - style_guide_project: Absolute path to style guide repository on node
#   - anthropic_auth_token: API authentication token
#   - anthropic_api_url: API base URL

- name: AI-Assisted Code Review
  hosts: all
  tasks:
    - name: Ensure review output directory exists
      ansible.builtin.file:
        path: "{{ review_output_dir }}"
        state: directory
        mode: '0755'

    - name: Copy Zuul inventory to output directory
      ansible.builtin.copy:
        src: "{{ zuul.executor.inventory_file }}"
        dest: "{{ review_output_dir }}/inventory.yaml"
        mode: '0644'

    - name: Select review source and scope
      ansible.builtin.set_fact:
        review_project_dir: >-
          {{ ansible_user_dir }}/{{ zuul.project.src_dir }}
        review_scope_mode: >-
          {{ 'branch'
             if (zuul.patchset | default('') | string)
                is match('^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$')
             else 'commit' }}

    - name: Resolve GitHub branch review base
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ review_project_dir }}"
          - merge-base
          - HEAD
          - "refs/remotes/origin/{{ zuul.branch }}"
      register: github_review_base
      changed_when: false
      when: review_scope_mode == 'branch'

    - name: Resolve Gerrit commit review base
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ review_project_dir }}"
          - rev-parse
          - HEAD^
      register: gerrit_review_base
      changed_when: false
      when: review_scope_mode == 'commit'

    - name: Record review base
      ansible.builtin.set_fact:
        review_base: >-
          {{ github_review_base.stdout
             if review_scope_mode == 'branch'
             else gerrit_review_base.stdout }}

    - name: Generate changed file list for review scope
      ansible.builtin.command:
        cmd: >-
          python3
          {{ style_guide_project }}/skills/teim-review/scripts/detect_changed_files.py
          {{ review_project_dir }}
          --base-ref {{ review_base }}
          --output {{ changed_files_file }}
      changed_when: false

    # noqa: command-instead-of-module -- ansible.builtin.git does not support fetching a single Gerrit ref
    - name: Fetch previous patchset for incremental review
      ansible.builtin.command:
        cmd: >-
          git -C {{ review_project_dir }}
          fetch origin
          refs/changes/{{ '%02d' | format(zuul.change | int % 100) }}/{{ zuul.change }}/{{ zuul.patchset | int - 1 }}
      changed_when: false
      ignore_errors: true
      register: fetch_previous_result
      when: zuul.patchset | int > 1

    - name: Detect inter-patchset changed lines for incremental review
      ansible.builtin.command:
        cmd: >-
          python3
          {{ style_guide_project }}/skills/teim-review/scripts/detect_changed_lines.py
          {{ review_project_dir }}
          --ref1 FETCH_HEAD
          --ref2 HEAD
          --output {{ changed_lines_file }}
      changed_when: false
      ignore_errors: true
      register: detect_lines_result
      when:
        - zuul.patchset | int > 1
        - ((fetch_previous_result | default({})).rc | default(1) | int) == 0

    - name: Record changed-lines availability
      ansible.builtin.set_fact:
        changed_lines_available: >-
          {{ ((detect_lines_result | default({})).rc | default(1) | int) == 0 }}

    - name: Run AI review setup (install teim-review plugin)
      ansible.builtin.include_role:
        name: ai_review_setup
      vars:
        ai_review_setup_claude_binary: "{{ claude_binary }}"
        ai_review_setup_claude_config_dir: "{{ claude_config_dir }}"
        ai_review_setup_haiku_model: "{{ haiku_model }}"
        ai_review_setup_sonnet_model: "{{ sonnet_model }}"
        ai_review_setup_opus_model: "{{ opus_model }}"
        ai_review_setup_review_output_dir: "{{ review_output_dir }}"
        ai_review_setup_style_guide_project: "{{ style_guide_project }}"
        ai_review_setup_anthropic_auth_token: "{{ anthropic_auth_token }}"
        ai_review_setup_anthropic_api_url: "{{ anthropic_api_url }}"

    - name: Perform AI code review (teim-review-agent validates findings)
      ansible.builtin.include_role:
        name: ai_code_review
      vars:
        ai_code_review_model: "{{ review_model }}"
        ai_code_review_inventory_file: "{{ review_output_dir }}/inventory.yaml"
        ai_code_review_style_guide_project: "{{ style_guide_project }}"
        ai_code_review_style_guide_quick_rules: "{{ style_guide_quick_rules }}"
        ai_code_review_style_guide_comprehensive: "{{ style_guide_comprehensive }}"
        ai_code_review_finding_policy: "{{ style_guide_project }}/prompts/teim-review-finding-policy.md"
        ai_code_review_report_file: "{{ review_report_file }}"
        ai_code_review_raw_report_file: "{{ review_output_dir }}/review-report.raw.json"
        ai_code_review_candidate_findings_file: "{{ review_output_dir }}/candidate-findings.json"
        ai_code_review_validated_findings_file: "{{ review_output_dir }}/validated-findings.json"
        ai_code_review_raw_validated_findings_file: "{{ review_output_dir }}/validated-findings.raw.json"
        ai_code_review_context_file: "{{ review_output_dir }}/review-context.json"
        ai_code_review_validation_file: "{{ review_output_dir }}/review-validation.json"
        ai_code_review_changed_files_file: "{{ changed_files_file }}"
        ai_code_review_review_base: "{{ review_base }}"
        ai_code_review_scope_mode: "{{ review_scope_mode }}"
        ai_code_review_output_dir: "{{ review_output_dir }}"
        ai_code_review_project_src_dir: "{{ review_project_dir }}"
        ai_code_review_claude_binary: "{{ claude_binary }}"
        ai_code_review_anthropic_auth_token: "{{ anthropic_auth_token }}"
        ai_code_review_anthropic_api_url: "{{ anthropic_api_url }}"

    - name: Build raw review report from validated findings
      ansible.builtin.command:
        cmd: >-
          python3
          {{ style_guide_project }}/tools/build_review_report.py
          --validated-findings {{ review_output_dir }}/validated-findings.raw.json
          --review-context {{ review_output_dir }}/review-context.json
          --output {{ review_output_dir }}/review-report.raw.json
          --validated-output {{ review_output_dir }}/validated-findings.json
      changed_when: true

    - name: Normalize structured AI review report
      ansible.builtin.command:
        cmd: >-
          python3
          {{ style_guide_project }}/tools/normalize_review_report.py
          --raw-report {{ review_output_dir }}/review-report.raw.json
          --candidate-findings {{ review_output_dir }}/candidate-findings.json
          --validated-findings {{ review_output_dir }}/validated-findings.json
          --schema {{ style_guide_project }}/schemas/review-report-schema.json
          --changed-files {{ changed_files_file }}
          {% if changed_lines_available | default(false) %}
          --changed-lines {{ changed_lines_file }}
          {% endif %}
          --output {{ review_report_file }}
          --diagnostics {{ review_output_dir }}/review-validation.json
      changed_when: true

    - name: Generate HTML report
      ansible.builtin.include_role:
        name: ai_html_generation
      vars:
        ai_html_generation_venv_dir: "{{ venv_dir }}"
        ai_html_generation_review_report_file: "{{ review_report_file }}"
        ai_html_generation_html_report_file: "{{ html_report_file }}"
        ai_html_generation_review_output_dir: "{{ review_output_dir }}"
        ai_html_generation_style_guide_project: "{{ style_guide_project }}"

    - name: Integrate with Zuul (comments and artifacts)
      ansible.builtin.include_role:
        name: ai_zuul_integration
      vars:
        ai_zuul_integration_venv_dir: "{{ venv_dir }}"
        ai_zuul_integration_review_report_file: "{{ review_report_file }}"
        ai_zuul_integration_html_report_file: "{{ html_report_file }}"
        ai_zuul_integration_zuul_comments_file: "{{ zuul_comments_file }}"
        ai_zuul_integration_changed_files_file: "{{ changed_files_file }}"
        ai_zuul_integration_changed_lines_file: "{{ changed_lines_file if (changed_lines_available | default(false)) else omit }}"
        ai_zuul_integration_review_output_dir: "{{ review_output_dir }}"

  post_tasks:
    - name: Extract issue statistics from review report
      ansible.builtin.command:
        cmd: >-
          jq -r '
            (.structured_output // .) as $d |
            (($d.statistics // {}) + {}) as $inline |
            (($d.statistics_html_only // {}) + {}) as $html |
            "Critical: \(($inline.critical // 0) + ($html.critical // 0))  " +
            "High: \(($inline.high // 0) + ($html.high // 0))  " +
            "Warnings: \(($inline.warnings // 0) + ($html.warnings // 0))  " +
            "Suggestions: \(($inline.suggestions // 0) + ($html.suggestions // 0))  " +
            "Total: \(($inline.total // 0) + ($html.total // 0))"
          ' {{ review_report_file }}
      register: teim_review_stats
      failed_when: false
      changed_when: false

    - name: Compute review status from issue counts
      ansible.builtin.set_fact:
        teim_review_status: >-
          {%- set raw = teim_review_stats.stdout | default('') -%}
          {%- set crit = (raw | regex_search('Critical: (\d+)', '\\1') or ['0'])[0] | int -%}
          {%- set tot = (raw | regex_search('Total: (\d+)', '\\1') or ['0'])[0] | int -%}
          {{ 'NEEDS ATTENTION' if crit > 0 else ('HAS SUGGESTIONS' if tot > 0 else 'CLEAN') }}

    - name: Display job summary
      ansible.builtin.debug:
        msg: |
          ================================================================
          AI Code Review Complete
          ================================================================
          Review Report (JSON): {{ review_report_file }}
          Review Validation: {{ review_output_dir }}/review-validation.json
          HTML Report: {{ html_report_file }}
          Zuul Comments: {{ zuul_comments_file }}

          Issue Statistics:
          {{ teim_review_stats.stdout | default('N/A') }}

          Status: {{ teim_review_status }}
          ================================================================
