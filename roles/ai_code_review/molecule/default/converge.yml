---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    ai_code_review_output_dir: "/tmp/code-review-test"
    ai_code_review_project_src_dir: "/tmp/project"
    ai_code_review_anthropic_auth_token: "test_token"
    ai_code_review_anthropic_api_url: "http://localhost:8080"
    ansible_user_dir: "/tmp"

  tasks:
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ai_code_review_output_dir }}"
        - "{{ ai_code_review_project_src_dir }}"
        - "/tmp/openstack-ai-style-guide/docs"
        - "/tmp/openstack-ai-style-guide/docs/knowledge"
        - "/tmp/openstack-ai-style-guide/docs/knowledge/overlays"
        - "/tmp/openstack-ai-style-guide/docs/knowledge/overlays/language"
        - "/tmp/openstack-ai-style-guide/docs/knowledge/examples"
        - "/tmp/openstack-ai-style-guide/docs/knowledge/examples/good"
        - "/tmp/openstack-ai-style-guide/schemas"
        - "/tmp/openstack-ai-style-guide/prompts"
        - "/tmp/openstack-ai-style-guide/tools"

    - name: Create mock Claude CLI script
      ansible.builtin.copy:
        dest: /usr/local/bin/mock-claude-review
        mode: '0755'
        content: |
          #!/bin/bash
          # Mock Claude CLI that writes valid validated-findings JSON
          # Output JSON to stdout first (for structured output mode)
          cat << 'EOF'
          {
            "type": "result",
            "structured_output": {
              "context": {"change": "12345", "scope": "Test", "review_basis": "Test basis"},
              "accepted_findings": [],
              "rejected_findings": []
            }
          }
          EOF

    - name: Create prerequisite review input files
      ansible.builtin.copy:
        dest: "{{ ai_code_review_output_dir }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: '0644'
      loop:
        - name: "inventory.yaml"
          content: |
            all:
              vars:
                zuul:
                  change: "12345"
                  patchset: "1"
                  project: openstack/nova
                  branch: master
        - name: "changed-files.txt"
          content: "nova/compute/manager.py\n"

    - name: Create prerequisite style guide files
      ansible.builtin.copy:
        dest: "/tmp/{{ item.name }}"
        content: "{{ item.content }}"
        mode: '0644'
      loop:
        - name: "openstack-ai-style-guide/docs/quick-rules.md"
          content: "# Quick Rules\n\nTest rules"
        - name: "openstack-ai-style-guide/docs/comprehensive-guide.md"
          content: "# Comprehensive Guide\n\nTest guide"
        - name: "openstack-ai-style-guide/docs/knowledge/README.md"
          content: "# Knowledge Root\n\nTest knowledge"
        - name: "openstack-ai-style-guide/docs/knowledge/overlays/language/openstack-python-review.md"
          content: "# OpenStack Python Review Overlay\n\nTest overlay"
        - name: "openstack-ai-style-guide/docs/knowledge/examples/good/README.md"
          content: "# Good Review Examples\n\nTest example"
        - name: "openstack-ai-style-guide/prompts/teim-review-finding-policy.md"
          content: "# Finding Policy\n\nTest policy"

    - name: Create minimal deterministic preparation tool
      ansible.builtin.copy:
        dest: "/tmp/openstack-ai-style-guide/tools/prepare_review_artifacts.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          import argparse
          import json
          from pathlib import Path

          parser = argparse.ArgumentParser()
          parser.add_argument('--output-dir', required=True)
          parser.add_argument('--project-dir')
          parser.add_argument('--inventory-file')
          parser.add_argument('--changed-files')
          parser.add_argument('--quick-rules')
          parser.add_argument('--comprehensive-guide')
          parser.add_argument('--finding-policy')
          parser.add_argument('--knowledge-root')
          parser.add_argument('--candidate-schema')
          parser.add_argument('--validated-schema')
          args = parser.parse_args()
          output = Path(args.output_dir)
          output.mkdir(parents=True, exist_ok=True)
          output.joinpath('zuul-context.md').write_text('# Zuul Context\n')
          output.joinpath('commit-summary.md').write_text('# Commit Summary\n')
          output.joinpath('project-guidelines.md').write_text('# Project Guidelines\n')
          output.joinpath('review-context.json').write_text(json.dumps({
              'change': '12345',
              'scope': 'Test scope',
              'review_basis': 'Test basis',
          }))

    - name: Create prerequisite JSON schema file
      ansible.builtin.copy:
        dest: "/tmp/openstack-ai-style-guide/schemas/review-report-schema.json"
        content: |
          {
            "type": "object",
            "properties": {
              "context": {"type": "object"},
              "statistics": {"type": "object"},
              "statistics_html_only": {"type": "object"},
              "issues": {"type": "object"},
              "patch_level_observations": {"type": "array"},
              "out_of_patch_observations": {"type": "array"},
              "positive_observations": {"type": "array"},
              "summary": {"type": "object"}
            }
          }
        mode: '0644'

    - name: Create intermediate JSON schema files
      ansible.builtin.copy:
        dest: "/tmp/openstack-ai-style-guide/schemas/{{ item }}"
        content: '{"type":"object"}'
        mode: '0644'
      loop:
        - candidate-findings-schema.json
        - validated-findings-schema.json

    - name: Run role with all prerequisites - success path
      ansible.builtin.include_role:
        name: ai_code_review
      vars:
        ai_code_review_claude_binary: mock-claude-review
        ai_code_review_model: "test-model"
        ai_code_review_style_guide_project: "/tmp/openstack-ai-style-guide"
      register: ai_code_review_role_result_success

    - name: Verify role succeeded
      ansible.builtin.assert:
        that:
          - ai_code_review_role_result_success is not failed
        fail_msg: "Role should have succeeded with all prerequisites"

    - name: Test validation failure - missing prerequisite path
      block:
        - name: Include role with missing prerequisite
          ansible.builtin.include_role:
            name: ai_code_review
          vars:
            ai_code_review_claude_binary: mock-claude-review
            ai_code_review_model: "test-model"
            ai_code_review_style_guide_project: "/tmp/openstack-ai-style-guide"
            ai_code_review_style_guide_quick_rules: "/tmp/missing-file.md"
      rescue:
        - name: Capture expected failure
          ansible.builtin.set_fact:
            ai_code_review_role_result_fail:
              failed: true
              msg: "{{ ansible_failed_result.msg | default('Role failed as expected') }}"
      always:
        - name: Verify role failed as expected
          ansible.builtin.assert:
            that:
              - ai_code_review_role_result_fail is defined
              - ai_code_review_role_result_fail.failed | default(false) | bool
            fail_msg: "Role should have failed with missing prerequisite path"
            success_msg: "Role correctly failed with missing prerequisite path"
