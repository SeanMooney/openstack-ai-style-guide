---
# AI Code Review Role
# Performs code review using deterministic preparation, one Claude invocation
# for review reasoning, and deterministic report assembly.

- name: Verify prerequisite paths exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: ai_code_review_prereq_paths
  loop:
    - "{{ ai_code_review_style_guide_quick_rules }}"
    - "{{ ai_code_review_style_guide_comprehensive }}"
    - "{{ ai_code_review_finding_policy }}"
    - "{{ ai_code_review_knowledge_root }}"
    - "{{ ai_code_review_json_schema }}"
    - "{{ ai_code_review_candidate_findings_schema }}"
    - "{{ ai_code_review_validated_findings_schema }}"
    - "{{ ai_code_review_inventory_file }}"

- name: Fail if prerequisite paths are missing
  ansible.builtin.fail:
    msg: "Missing prerequisite path: {{ item.item }}"
  when: not item.stat.exists
  loop: "{{ ai_code_review_prereq_paths.results }}"

- name: Prepare deterministic review artifacts
  ansible.builtin.command:
    cmd: >-
      python3
      {{ ai_code_review_style_guide_project }}/tools/prepare_review_artifacts.py
      --project-dir {{ ai_code_review_project_src_dir }}
      --output-dir {{ ai_code_review_output_dir }}
      --inventory-file {{ ai_code_review_inventory_file }}
      --changed-files {{ ai_code_review_changed_files_file }}
      --quick-rules {{ ai_code_review_style_guide_quick_rules }}
      --comprehensive-guide {{ ai_code_review_style_guide_comprehensive }}
      --finding-policy {{ ai_code_review_finding_policy }}
      --knowledge-root {{ ai_code_review_knowledge_root }}
      --candidate-schema {{ ai_code_review_candidate_findings_schema }}
      --validated-schema {{ ai_code_review_validated_findings_schema }}
  changed_when: true

- name: Create teim-review orchestration prompt
  ansible.builtin.set_fact:
    ai_code_review_review_prompt: >-
      Use the @teim-review-agent subagent to perform the model reasoning
      portion of a teim-review code review.

      inventory_file: {{ ai_code_review_inventory_file }}
      output_dir: {{ ai_code_review_output_dir }}
      project_dir: {{ ai_code_review_project_src_dir }}
      changed_files_file: {{ ai_code_review_changed_files_file }}
      zuul_context_file: {{ ai_code_review_output_dir }}/zuul-context.md
      commit_summary_file: {{ ai_code_review_output_dir }}/commit-summary.md
      project_guidelines_file: {{ ai_code_review_output_dir }}/project-guidelines.md
      review_context_file: {{ ai_code_review_context_file }}
      candidate_findings_schema: {{ ai_code_review_candidate_findings_schema }}
      validated_findings_schema: {{ ai_code_review_validated_findings_schema }}
      candidate_findings_file: {{ ai_code_review_candidate_findings_file }}
      validated_findings_file: {{ ai_code_review_validated_findings_file }}
      review_validation_file: {{ ai_code_review_validation_file }}
      style_guide_quick_rules: {{ ai_code_review_style_guide_quick_rules }}
      style_guide_comprehensive: {{ ai_code_review_style_guide_comprehensive }}
      finding_policy: {{ ai_code_review_finding_policy }}
      knowledge_root: {{ ai_code_review_knowledge_root }}
      json_schema: {{ ai_code_review_json_schema }}
      tools_dir: {{ ai_code_review_style_guide_project }}/tools
      generate_html: false

      Deterministic preparation has already produced the context artifacts.
      Do not invoke extraction subagents or regenerate these artifacts.
      Complete candidate generation and finding validation in this one Claude
      invocation. Aim to complete model reasoning within 12 minutes.

      Return structured JSON conforming to validated_findings_schema. Also
      write the same validated findings JSON to
      {{ ai_code_review_validated_findings_file }}. Do not produce the final
      review report; deterministic tooling will build review-report.raw.json,
      calculate routing, statistics, and publication safety after this Claude
      invocation.

- name: Execute code review with Claude via teim-review-agent
  ansible.builtin.include_role:
    name: run_claude_code
  vars:
    run_claude_code_prompt_text: "{{ ai_code_review_review_prompt }}"
    run_claude_code_model_name: "{{ ai_code_review_model }}"
    run_claude_code_output_file: "{{ ai_code_review_raw_validated_findings_file }}"
    run_claude_code_json_schema: "{{ ai_code_review_validated_findings_schema }}"
    run_claude_code_output_format: "json"
    run_claude_code_command_name: "code review"
    run_claude_code_working_dir: "{{ ai_code_review_project_src_dir }}"
    run_claude_code_claude_binary: "{{ ai_code_review_claude_binary }}"
    run_claude_code_anthropic_auth_token: "{{ ai_code_review_anthropic_auth_token }}"
    run_claude_code_anthropic_api_url: "{{ ai_code_review_anthropic_api_url }}"
    run_claude_code_effort: "{{ ai_code_review_claude_effort }}"
    run_claude_code_bare: "{{ ai_code_review_claude_bare }}"
    run_claude_code_plugin_dir: "{{ ai_code_review_claude_plugin_dir }}"

# Claude CLI validates the structured_output against the schema automatically.
# The downstream Python scripts handle extracting structured_output from the
# Claude CLI wrapper and building the final review report deterministically.
